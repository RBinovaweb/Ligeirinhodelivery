<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Ligeirinho ⚡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.top{padding:15px 18px;border-bottom:1px solid #8d6a18;background:#0d0d0d;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{color:#d4af37;font-size:23px;font-weight:900}.wrap{max-width:1200px;margin:auto;padding:18px}.login{max-width:420px;margin:12vh auto;background:#111;border:1px solid #333;border-radius:18px;padding:25px}.panel{display:none}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab{background:#151515;color:#fff;border:1px solid #444;padding:11px 14px;border-radius:10px;white-space:nowrap}.tab.active{background:#d4af37;color:#000}.box{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{margin-bottom:11px}.field label{display:block;color:#bbb;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#090909;color:#fff;border:1px solid #444;border-radius:9px;padding:11px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}.gold{background:#d4af37;color:#000}.danger{background:#ff5b5b;color:#fff}.dark{background:#222;color:#fff;border:1px solid #555}.product-row,.order{border:1px solid #292929;background:#151515;border-radius:12px;padding:12px;margin:8px 0}.product-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center}.product-row img{width:70px;height:60px;object-fit:cover;border-radius:8px}.muted{color:#999;font-size:13px}.stat{font-size:25px;color:#d4af37;font-weight:bold}.login h1{text-align:center;color:#d4af37}.hidden{display:none!important}.status{padding:4px 8px;border-radius:20px;background:#332b12;color:#d4af37;font-size:12px}@media(max-width:600px){.product-row{grid-template-columns:55px 1fr}.product-row .actions{grid-column:1/-1}.product-row img{width:55px;height:50px}}
</style>
</head>
<body>
<header class="top"><div class="logo">Ligeirinho ⚡ — Painel</div><button id="logout" class="btn dark hidden">Sair</button></header>
<div class="wrap">
<section id="loginBox" class="login"><h1>🔐 Acesso administrativo</h1><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="password" type="password"></div><button class="btn gold" style="width:100%" id="loginBtn">ENTRAR</button><p id="loginMsg" class="muted"></p></section>
<section id="panel" class="panel">
<div class="tabs"><button class="tab active" data-tab="produtos">🛒 Produtos</button><button class="tab" data-tab="config">⚙️ Configurações</button><button class="tab" data-tab="pedidos">📦 Pedidos</button></div>
<div id="produtos" class="tabcontent"><div class="box"><h2>Produto</h2><input type="hidden" id="productKey"><div class="grid"><div class="field"><label>Nome</label><input id="pName"></div><div class="field"><label>Categoria</label><input id="pCategory" list="categoryList"><datalist id="categoryList"></datalist></div><div class="field"><label>Preço</label><input id="pPrice" type="number" step="0.01"></div><div class="field"><label>Imagem (URL)</label><input id="pImage"></div></div><div class="field"><label>Descrição</label><textarea id="pDescription" rows="2"></textarea></div><label><input id="pAlcohol" type="checkbox"> Produto alcoólico 18+</label><label style="margin-left:15px"><input id="pActive" type="checkbox" checked> Disponível na loja</label><br><br><button class="btn gold" id="saveProduct">💾 SALVAR PRODUTO</button> <button class="btn dark" id="clearProduct">Limpar</button></div>
<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Produtos cadastrados</h2><button class="btn gold" id="seedBtn">Importar produtos iniciais</button></div><div id="productsList">Carregando...</div></div></div>
<div id="config" class="tabcontent hidden"><div class="box"><h2>⚙️ Configurações da loja</h2><div class="grid"><div class="field"><label>WhatsApp que recebe pedidos</label><input id="sWhatsapp"></div><div class="field"><label>Chave Pix</label><input id="sPix"></div><div class="field"><label>Taxa de entrega (0 = combinar)</label><input id="sFee" type="number" step="0.01"></div><div class="field"><label>Nome da loja</label><input id="sName"></div></div><div class="field"><label>Descrição principal</label><textarea id="sDesc" rows="3"></textarea></div><button class="btn gold" id="saveSettings">💾 SALVAR CONFIGURAÇÕES</button></div></div>
<div id="pedidos" class="tabcontent hidden"><div class="box"><h2>📦 Pedidos</h2><div id="ordersList">Carregando...</div></div></div>
</section></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getDatabase,ref,onValue,set,push,update,remove} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import {firebaseConfig} from "./firebase-config.js";
import {INITIAL_PRODUCTS} from "./seed-products.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
let products={};
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(e){$("loginMsg").textContent="Login inválido: "+e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(user){$("loginBox").classList.add("hidden");$("panel").style.display="block";$("logout").classList.remove("hidden");load()}else{$("loginBox").classList.remove("hidden");$("panel").style.display="none";$("logout").classList.add("hidden")}});
function load(){onValue(ref(db,"products"),s=>{products=s.val()||{};renderProducts();fillCategories()});onValue(ref(db,"settings"),s=>{let x=s.val()||{};$("sWhatsapp").value=x.whatsapp||"5527995812932";$("sPix").value=x.pixKey||"14210186759";$("sFee").value=x.deliveryFee||0;$("sName").value=x.storeName||"Ligeirinho ⚡";$("sDesc").value=x.storeDescription||"Seu pedido rápido, fácil e direto."});onValue(ref(db,"orders"),s=>renderOrders(s.val()||{}))}
function renderProducts(){let arr=Object.entries(products);$("productsList").innerHTML=arr.length?arr.map(([key,p])=>`<div class="product-row"><img src="${esc(p.image||"")}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${money(p.price)} · ${p.active===false?"indisponível":"disponível"}</div></div><div class="actions"><button class="btn gold" onclick="editProduct('${key}')">Editar</button> <button class="btn danger" onclick="deleteProduct('${key}')">Excluir</button></div></div>`).join(""):"Nenhum produto cadastrado."}
function fillCategories(){let cats=[...new Set(Object.values(products).map(p=>p.category).filter(Boolean))];$("categoryList").innerHTML=cats.map(x=>`<option value="${esc(x)}">`).join("")}
window.editProduct=k=>{let p=products[k];$("productKey").value=k;$("pName").value=p.name||"";$("pCategory").value=p.category||"";$("pPrice").value=p.price||0;$("pImage").value=p.image||"";$("pDescription").value=p.description||"";$("pAlcohol").checked=!!p.alcohol;$("pActive").checked=p.active!==false;scrollTo({top:0,behavior:"smooth"})};
window.deleteProduct=async k=>{if(confirm("Excluir este produto?"))await remove(ref(db,"products/"+k))};
$("clearProduct").onclick=()=>{["productKey","pName","pCategory","pPrice","pImage","pDescription"].forEach(x=>$(x).value="");$("pAlcohol").checked=false;$("pActive").checked=true};
$("saveProduct").onclick=async()=>{let k=$("productKey").value||push(ref(db,"products")).key;let p={name:$("pName").value.trim(),category:$("pCategory").value.trim(),price:Number($("pPrice").value),image:$("pImage").value.trim(),description:$("pDescription").value.trim(),alcohol:$("pAlcohol").checked,active:$("pActive").checked};if(!p.name||!p.category||!p.price){return alert("Preencha nome, categoria e preço.")}await set(ref(db,"products/"+k),p);alert("Produto salvo!");$("clearProduct").click()};
$("seedBtn").onclick=async()=>{if(!confirm("Importar os produtos iniciais? Produtos existentes serão mantidos e os mesmos IDs poderão ser duplicados."))return;for(const p of INITIAL_PRODUCTS){let k=push(ref(db,"products")).key;await set(ref(db,"products/"+k),{...p,active:true})}alert("Produtos importados!")};
$("saveSettings").onclick=async()=>{await set(ref(db,"settings"),{whatsapp:$("sWhatsapp").value.trim(),pixKey:$("sPix").value.trim(),deliveryFee:Number($("sFee").value)||0,storeName:$("sName").value.trim()||"Ligeirinho ⚡",storeDescription:$("sDesc").value.trim()});alert("Configurações salvas!")};
function renderOrders(o){let arr=Object.entries(o).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));$("ordersList").innerHTML=arr.length?arr.map(([k,x])=>`<div class="order"><b>${esc(x.customer?.name||"Cliente")}</b> <span class="status">${esc(x.status||"novo")}</span><div class="muted">${new Date(x.createdAt||Date.now()).toLocaleString("pt-BR")} · ${money(x.total)}</div><div style="margin-top:8px">${(x.items||[]).map(i=>`${esc(i.name)} x${i.quantity}`).join(" · ")}</div><div style="margin-top:8px"><button class="btn gold" onclick="statusOrder('${k}','pago')">Pago</button> <button class="btn dark" onclick="statusOrder('${k}','comprando')">Comprando</button> <button class="btn dark" onclick="statusOrder('${k}','em_entrega')">Em entrega</button> <button class="btn dark" onclick="statusOrder('${k}','entregue')">Entregue</button></div></div>`).join(""):"Nenhum pedido."}
window.statusOrder=async(k,status)=>update(ref(db,"orders/"+k),{status});
function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".tabcontent").forEach(x=>x.classList.add("hidden"));$(b.dataset.tab).classList.remove("hidden")});
</script>
</body></html>
